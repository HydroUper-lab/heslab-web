<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HESLab</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#f5f7fa;
}

/* ====================
   HEADER
==================== */

.hero{
    background:#0b2948;
    color:white;
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:3rem;
    margin:15px 0;
}

.hero p{
    max-width:900px;
    margin:auto;
}

/* ====================
   GALLERY
==================== */

.gallery{
    max-width:1200px;
    margin:50px auto;
    padding:0 20px;
}

.gallery h2{
    text-align:center;
    color:#0b2948;
    margin-bottom:20px;
}

.gallery-container{
    position:relative;
    overflow:hidden;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
}

.gallery-container img{
    width:100%;
    height:600px;
    object-fit:cover;
    display:block;
}

.gallery-overlay{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    background:
    linear-gradient(
        transparent,
        rgba(0,0,0,.75)
    );

    color:white;
    padding:30px;
}

.gallery-overlay h3{
    font-size:1.5rem;
}

.gallery-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);

    width:50px;
    height:50px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.45);
    color:white;

    font-size:20px;
    cursor:pointer;
}

.gallery-btn:hover{
    background:rgba(0,0,0,.75);
}

.prev{
    left:15px;
}

.next{
    right:15px;
}

/* ====================
   MOBILE
==================== */

@media(max-width:768px){

    .hero h1{
        font-size:2rem;
    }

    .gallery-container img{
        height:300px;
    }

}

</style>

</head>
<body>

<section class="hero">

    <h2>
        Berilmu, Bermanfaat, dan Berdampak
    </h2>

    <h1>
        Hydro-Environmental System Laboratory
    </h1>

    <p>
        Laboratorium riset Universitas Pertamina yang berfokus pada
        pemodelan hidrologi, manajemen risiko bencana air,
        dan dampak perubahan iklim.
    </p>

</section>

<section class="gallery">

    <h2>Galeri HESLab</h2>

    <div class="gallery-container">

        <img
            id="galleryImage"
            src=""
            alt="Galeri HESLab">

        <div class="gallery-overlay">

            <h3 id="galleryTitle"></h3>

        </div>

        <button
            class="gallery-btn prev"
            onclick="prevImage()">
            ❮
        </button>

        <button
            class="gallery-btn next"
            onclick="nextImage()">
            ❯
        </button>

    </div>

</section>

<script>

let gallery = [];
let currentIndex = 0;

const imageElement =
document.getElementById("galleryImage");

const titleElement =
document.getElementById("galleryTitle");

fetch("assets/data/gallery.json")
.then(response => response.json())
.then(data => {

    gallery = data;

    if(gallery.length === 0){
        return;
    }

    showImage(0);

    setInterval(() => {
        nextImage();
    },5000);

})
.catch(error => {
    console.error(
        "Gagal membaca gallery.json",
        error
    );
});

function showImage(index){

    imageElement.src =
        gallery[index].image;

    titleElement.textContent =
        gallery[index].title;
}

function nextImage(){

    currentIndex++;

    if(currentIndex >= gallery.length){
        currentIndex = 0;
    }

    showImage(currentIndex);
}

function prevImage(){

    currentIndex--;

    if(currentIndex < 0){
        currentIndex =
            gallery.length - 1;
    }

    showImage(currentIndex);
}

</script>

</body>
</html>
